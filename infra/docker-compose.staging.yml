name: ${COMPOSE_PROJECT_NAME:-wildlog-staging}
services:
  api:
    image: alpine:3.20
    profiles: [staging]
    command: ["sh", "-c", "mkdir -p /srv && echo 'WildLog API placeholder' > /srv/index.html && exec busybox httpd -f -p 0.0.0.0:8080 -h /srv"]
    ports: ["${WILDLOG_API_PORT:-8081}:8080"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wildlog}
      MYSQL_USER: ${MYSQL_USER:-wildlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
  worker:
    image: alpine:3.20
    profiles: [staging]
    command: ["sh", "-c", "echo 'WildLog worker placeholder' && exec sleep infinity"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wildlog}
      MYSQL_USER: ${MYSQL_USER:-wildlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wildlog}
      MYSQL_USER: ${MYSQL_USER:-wildlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio_data:/data]
    restart: unless-stopped
volumes:
  mysql_data:
  minio_data:
