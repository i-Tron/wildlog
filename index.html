<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>野录 WildLog · 观鸟攻略</title><style>body{margin:0;background:#f7f7f2;color:#17342f;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{padding:24px 6vw;background:#dff0e8;position:sticky;top:0;z-index:2}.top,.hero,.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between}.brand{font-weight:800;font-size:21px}.brand span{color:#e76f51}.tag,.meta{color:#6f827c;font-size:13px}.hero{padding:45px 6vw 18px}.eyebrow{font-size:12px;color:#2a9d8f;font-weight:700}.hero h1{font-size:clamp(32px,6vw,66px);line-height:1.05;margin:10px 0}.hero p{max-width:560px;color:#6f827c}.search{display:flex;gap:10px;margin-top:22px}.search input{flex:1;padding:14px;border:1px solid #dde6df;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;background:#17342f;color:white;padding:12px 18px;font-weight:700;cursor:pointer}.wrap{padding:10px 6vw}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 26px}.filter{padding:8px 13px;border:1px solid #dde6df;border-radius:99px;background:white;color:#6f827c;cursor:pointer}.filter.active{background:#17342f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid #dde6df;border-radius:18px;overflow:hidden}.visual{height:145px;padding:16px;font-size:34px;background:linear-gradient(135deg,#b7d9ca,#e8cfa9)}.blue{background:linear-gradient(135deg,#a7c8d6,#dfe8d0)}.pink{background:linear-gradient(135deg,#e6b9b0,#f0dfb4)}.body{padding:18px}.card h3{margin:5px 0;font-size:20px}.chips{display:flex;gap:6px;margin:13px 0}.chip{font-size:12px;padding:4px 8px;background:#e9f3ef;border-radius:6px}.actions{display:flex;justify-content:space-between;align-items:center}.link{color:#e76f51;font-weight:700;cursor:pointer}.save{border:0;background:none;font-size:20px;cursor:pointer}.note{margin:28px 0;padding:14px 16px;border-left:3px solid #e76f51;background:#fff8ed;color:#735744;font-size:13px}.detail{display:none;background:white;border:1px solid #dde6df;border-radius:20px;padding:25px;margin-top:22px}.detail.show{display:block}.toc{display:flex;gap:8px;flex-wrap:wrap}.toc a{color:#2a9d8f;text-decoration:none;background:#e9f3ef;padding:7px 10px;border-radius:8px}.footer{padding:50px 6vw;color:#6f827c;font-size:13px;text-align:center}@media(max-width:600px){.hero,.wrap{padding-left:5vw;padding-right:5vw}.search{flex-direction:column}.top{padding:0 5vw}.btn{height:46px}}
</style></head><body><header><div class='top'><div class='brand'>野录 <span>WildLog</span></div><div class='tag'>上海先行 · 逐步开放全国</div></div></header><main><section class='hero'><div class='eyebrow'>编辑发布型攻略合集</div><h1>把每一次潮汐，<br>走成一场发现。</h1><p>为第一次出发的人整理可读、可走、可核验的观鸟攻略。先从上海出发，更多地区按实际资料逐步开放。</p><div class='search'><input id='search' placeholder='搜索地点、鸟种或关键词…'><button class='btn' onclick='render()'>搜索攻略</button></div></section><section class='wrap'><div class='filters' id='filters'></div><div class='grid' id='grid'></div><div class='detail' id='detail'></div><div class='note'>首批三篇攻略来自公开资料整理，当前均为待核验。开放时间、预约、交通、潮汐、费用与当天鸟讯都必须按来源字段和出行日期复核；不含私人行程、预订或联系方式。</div></section></main><div class='footer'>收藏保存在本地浏览器（存储受限时仅当前页面有效） · 系统分享或复制链接失败时可手工复制</div><script>const data=[
{id:'sh-dongtan',title:'崇明东滩｜先确认开放规则，再看潮间带候鸟',area:'上海',season:'秋冬',difficulty:'入门',emoji:'🪶',cls:'blue',desc:'河口潮汐湿地的半日框架；公众范围、预约、接驳和潮汐均须按当天官方信息核验。',status:'待核验',sourceNote:'公开来源：崇明区政府 2024/2025、上海市绿化市容咨询答复 2024；本次整理 2026-10-01。',sections:[['出发前','先确认科普教育基地是否开放、预约方式、报到点、接驳和天气。保护区不是普通景区，未确认的入口和时段不作承诺。'],['到达与观察','按工作人员引导参观科普场馆和开放木栈道，使用望远镜观察远处鸟类；不越过围栏、不自行寻找滩涂或巢址。'],['装备清单','双筒望远镜、防风防晒外层、防滑鞋和饮水。历史公告提示服务设施可能有限，当前情况需出发前复核。'],['记录与分享','记录日期、天气、鸟类行为和来源，把长期鸟种记录与当天实见分开；不发布保护区敏感点位。']]},
{id:'js-tiaozini',title:'东台条子泥｜跟着潮线理解 720 高地',area:'江苏',season:'春秋冬',difficulty:'进阶',emoji:'🌊',cls:'',desc:'从公开政府与林草资料整理潮线观察框架；开放边界、接驳和潮位均待核验。',status:'待核验',sourceNote:'公开来源：盐城市/东台市政府 2026、生态环境部 2021、国家林草局 2026；本次整理 2026-10-01。',sections:[['出发前','核验开放公告、预约、交通、天气和潮汐。720 高地和川水湾等名称来自公开资料，不代表当天全部可进入。'],['到达与观察','若当天开放，在公开平台观察涨潮时鸟群向高位栖息地移动、退潮时远处滩涂觅食的生态逻辑；不下滩、不追鸟。'],['装备清单','双筒望远镜、防风防晒外层、防滑鞋、饮水和充电宝；不要使用诱鸟音、无人机或强光。'],['记录与分享','把季节性报道与当天观察分开，记录潮位来源和观察距离；不发布敏感巢址或绕开管理的方法。']]},
{id:'hz-qiantang',title:'杭州湾/钱塘江湾｜把江海湿地当作迁徙观察窗口',area:'浙江',season:'冬季',difficulty:'入门到进阶',emoji:'🌅',cls:'pink',desc:'以临江江海湿地、海塘和钱塘江沿岸为观察语境；分区开放与岸线安全须先核验。',status:'待核验',sourceNote:'公开来源：杭州政协/杭州新闻 2022–2024、学术论文 2013、国家林草局 2024；本次整理 2026-10-01。',sections:[['出发前','选定一个具体分区，核验开放、交通、停车、潮汐和岸线安全；不要把钱塘区与宁波杭州湾湿地公园混为一处。'],['到达与观察','在开放步道或安全海塘观察远处水面、芦苇和滩涂，日出前后光线较好；不下堤、不下滩、不跨越警示线。'],['装备清单','双筒望远镜、帽子、防晒、防风外层和饮水；河口风大，冬季注意保暖。'],['记录与分享','区分区域历史鸟类记录和当天实见，写明观察日期与来源；不对稀有鸟种作“必见”承诺。']]}
];let active='全部',saved=[];try{const value=JSON.parse(localStorage.getItem('bird-saved')||'[]');if(Array.isArray(value))saved=value.filter(x=>typeof x==='string')}catch(e){}const filters=['全部','上海','江苏','浙江','春季','秋冬','冬季','入门','进阶'];filtersEl=document.getElementById('filters');filtersEl.innerHTML=filters.map(x=>`<button class='filter ${x==='全部'?'active':''}' onclick="setFilter('${x}')">${x}</button>`).join('');function setFilter(x){active=x;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.textContent===x));render()}function render(){let q=document.getElementById('search').value.toLowerCase();let list=data.filter(d=>(active==='全部'||Object.values(d).includes(active))&&(!q||JSON.stringify(d).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.map(d=>`<article class='card'><div class='visual ${d.cls}'>${d.emoji}</div><div class='body'><div class='eyebrow'>${d.area} · ${d.status}</div><div class='meta'>${d.sourceNote}</div><h3>${d.title}</h3><div class='meta'>${d.season} · ${d.difficulty}</div><p>${d.desc}</p><div class='chips'><span class='chip'>路线骨架</span><span class='chip'>观测礼仪</span></div><div class='actions'><span class='link' onclick="openDetail('${d.id}')">查看攻略 →</span><button class='save' aria-label='收藏' onclick="toggleSave('${d.id}')">${saved.includes(d.id)?'★':'☆'}</button></div></div></article>`).join('')||'<p>还没有匹配的攻略，试试清空筛选。</p>'}function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('bird-saved',JSON.stringify(saved))}catch(e){alert('浏览器无法保存收藏；本次页面内仍可使用，刷新后可能丢失。')}render()}function openDetail(id){let d=data.find(x=>x.id===id);let el=document.getElementById('detail');el.classList.add('show');el.innerHTML=`<div class='eyebrow'>${d.area} · ${d.status}</div><h2>${d.title}</h2><p>${d.desc}</p><h3>攻略目录</h3><p class='meta'>${d.sourceNote}</p><div class='toc'>${(d.sections||[['出发前',''],['到达与观察',''],['装备清单',''],['记录与分享','']]).map((x,i)=>`<a href='#${d.id}-section-${i}'>${x[0]}</a>`).join('')}</div>${d.sections?d.sections.map((x,i)=>`<section id='${d.id}-section-${i}'><h3>${x[0]}</h3><p>${x[1]}</p></section>`).join(''):"<p class='meta'>这是演示详情结构；具体路线、潮汐、开放规则与鸟种信息尚无实地来源，需核验后发布。</p>"}<button class='btn' onclick='share()'>分享此攻略</button>`;el.scrollIntoView({behavior:'smooth'})}function manualCopy(text){let box=document.getElementById('manual-copy');if(!box){box=document.createElement('div');box.id='manual-copy';document.getElementById('detail').appendChild(box)}box.replaceChildren();const label=document.createElement('p');label.textContent='未能自动分享或复制，请手工复制以下链接（本地文件链接仅适用于这台电脑）：';const input=document.createElement('input');input.readOnly=true;input.value=text;input.setAttribute('aria-label','手工复制攻略链接');box.append(label,input);input.focus();input.select()}
async function share(){const text=location.href;if(typeof navigator.share==='function'){try{await navigator.share({title:'野录 WildLog 攻略',url:text});alert('已完成系统分享');return}catch(e){if(e&&e.name==='AbortError')return}}if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){try{await navigator.clipboard.writeText(text);alert('已复制攻略链接');return}catch(e){}}manualCopy(text)}render();</script></body></html>
