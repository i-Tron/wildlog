<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>野录 WildLog · 观鸟攻略</title><style>body{margin:0;background:#f7f7f2;color:#17342f;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{padding:24px 6vw;background:#dff0e8;position:sticky;top:0;z-index:2}.top,.hero,.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between}.brand{font-weight:800;font-size:21px}.brand span{color:#e76f51}.tag,.meta{color:#6f827c;font-size:13px}.hero{padding:45px 6vw 18px}.eyebrow{font-size:12px;color:#2a9d8f;font-weight:700}.hero h1{font-size:clamp(32px,6vw,66px);line-height:1.05;margin:10px 0}.hero p{max-width:560px;color:#6f827c}.search{display:flex;gap:10px;margin-top:22px}.search input{flex:1;padding:14px;border:1px solid #dde6df;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;background:#17342f;color:white;padding:12px 18px;font-weight:700;cursor:pointer}.wrap{padding:10px 6vw}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 26px}.filter{padding:8px 13px;border:1px solid #dde6df;border-radius:99px;background:white;color:#6f827c;cursor:pointer}.filter.active{background:#17342f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid #dde6df;border-radius:18px;overflow:hidden}.visual{height:145px;padding:16px;font-size:34px;background:linear-gradient(135deg,#b7d9ca,#e8cfa9)}.blue{background:linear-gradient(135deg,#a7c8d6,#dfe8d0)}.pink{background:linear-gradient(135deg,#e6b9b0,#f0dfb4)}.body{padding:18px}.card h3{margin:5px 0;font-size:20px}.chips{display:flex;gap:6px;margin:13px 0}.chip{font-size:12px;padding:4px 8px;background:#e9f3ef;border-radius:6px}.actions{display:flex;justify-content:space-between;align-items:center}.link{color:#e76f51;font-weight:700;cursor:pointer}.save{border:0;background:none;font-size:20px;cursor:pointer}.note{margin:28px 0;padding:14px 16px;border-left:3px solid #e76f51;background:#fff8ed;color:#735744;font-size:13px}.detail{display:none;background:white;border:1px solid #dde6df;border-radius:20px;padding:25px;margin-top:22px}.detail.show{display:block}.toc{display:flex;gap:8px;flex-wrap:wrap}.toc a{color:#2a9d8f;text-decoration:none;background:#e9f3ef;padding:7px 10px;border-radius:8px}.footer{padding:50px 6vw;color:#6f827c;font-size:13px;text-align:center}@media(max-width:600px){.hero,.wrap{padding-left:5vw;padding-right:5vw}.search{flex-direction:column}.top{padding:0 5vw}.btn{height:46px}}
</style></head><body><header><div class='top'><div class='brand'>野录 <span>WildLog</span></div><div class='tag'>上海先行 · 逐步开放全国</div></div></header><main><section class='hero'><div class='eyebrow'>编辑发布型攻略合集</div><h1>把每一次潮汐，<br>走成一场发现。</h1><p>为第一次出发的人整理可读、可走、可核验的观鸟攻略。先从上海出发，更多地区按实际资料逐步开放。</p><div class='search'><input id='search' placeholder='搜索地点、鸟种或关键词…'><button class='btn' onclick='render()'>搜索攻略</button></div></section><section class='wrap'><div class='filters' id='filters'></div><div class='grid' id='grid'></div><div class='detail' id='detail'></div><div class='note'>内容状态：示例攻略用于演示产品结构；路线、开放时间与鸟讯请在发布前逐条核验。暂未取得“盐城东台条子泥攻略”原文，本原型未宣称复用。</div></section></main><div class='footer'>收藏保存在本地浏览器 · 分享优先复制直链，失败时可复制标题</div><script>const data=[{id:'sh-dongtan',title:'崇明东滩｜潮间带的第一堂课',area:'上海',season:'秋冬',level:'入门',emoji:'🪶',cls:'blue',desc:'适合第一次看水鸟的半日路线框架，重点关注潮汐、光线与观察距离。',status:'演示内容'},{id:'sh-nanhui',title:'南汇东滩｜风从芦苇里来',area:'上海',season:'春季',level:'轻量',emoji:'🌾',cls:'pink',desc:'城市周末出发的观察清单模板，留出候鸟记录与装备复盘。',status:'待核验'},{id:'js-tiaozini',title:'盐城东台条子泥｜资料占位',area:'江苏',season:'秋冬',level:'进阶',emoji:'🌊',cls:'',desc:'此卡仅作为未来全国扩展的内容槽位，等待取得并核验原攻略。',status:'资料缺口'}];let active='全部',saved=JSON.parse(localStorage.getItem('bird-saved')||'[]');const filters=['全部','上海','江苏','春季','秋冬','入门','进阶'];filtersEl=document.getElementById('filters');filtersEl.innerHTML=filters.map(x=>`<button class='filter ${x==='全部'?'active':''}' onclick="setFilter('${x}')">${x}</button>`).join('');function setFilter(x){active=x;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.textContent===x));render()}function render(){let q=document.getElementById('search').value.toLowerCase();let list=data.filter(d=>(active==='全部'||Object.values(d).includes(active))&&(!q||JSON.stringify(d).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.map(d=>`<article class='card'><div class='visual ${d.cls}'>${d.emoji}</div><div class='body'><div class='eyebrow'>${d.area} · ${d.status}</div><h3>${d.title}</h3><div class='meta'>${d.season} · ${d.level}</div><p>${d.desc}</p><div class='chips'><span class='chip'>路线骨架</span><span class='chip'>观测礼仪</span></div><div class='actions'><span class='link' onclick="openDetail('${d.id}')">查看攻略 →</span><button class='save' aria-label='收藏' onclick="toggleSave('${d.id}')">${saved.includes(d.id)?'★':'☆'}</button></div></div></article>`).join('')||'<p>还没有匹配的攻略，试试清空筛选。</p>'}function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('bird-saved',JSON.stringify(saved));render()}function openDetail(id){let d=data.find(x=>x.id===id);let el=document.getElementById('detail');el.classList.add('show');el.innerHTML=`<div class='eyebrow'>${d.area} · ${d.status}</div><h2>${d.title}</h2><p>${d.desc}</p><h3>攻略目录</h3><div class='toc'><a href='#'>出发前</a><a href='#'>到达与观察</a><a href='#'>装备清单</a><a href='#'>记录与分享</a></div><p class='meta'>这里是可复用的详情页结构。具体路线、潮汐、开放规则与鸟种信息需由编辑核验后发布。</p><button class='btn' onclick='share()'>分享此攻略</button>`;el.scrollIntoView({behavior:'smooth'})}async function share(){let text=location.href;if(navigator.share){try{await navigator.share({title:'野录 WildLog 攻略',url:text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('已复制攻略直链')}}render();</script></body></html>
